name: CI-CD Pipeline

on:
  push:
    branches: [main]

jobs:
  ci-cd:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: echo "Build success"

      - name: Test
        run: echo "Tests passed"

      - name: Deploy (CD)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          echo "deployment successful"

